name: Supportsite

# Zet de supportsite (map site/) via FTPS op de webserver, in de map waar support.bingr.online naar wijst.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD en optioneel FTP_DIR (de map van het subdomein; leeg = hoofdmap van de FTP-login,
# bv. een eigen FTP-account van support.bingr.online). Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam om te proberen).
# Alleen FTPS met een geverifieerd certificaat; FTP_SERVER moet een naam uit het certificaat zijn (bij gedeelde hosting vaak die
# van de hoster), anders zoekt de workflow een naam uit het certificaat met hetzelfde IP-adres of stopt met een foutmelding.
# Ontbreekt er een secret, dan alleen een waarschuwing (geen fout). Nooit in de webmap van bingr.online of de map van beheer.bingr.online.
# Het buildnummer in de footer komt uit assets/changelog.json: die haalt de workflow bij elke deploy en elke nacht vers van bingr.online.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy.yml']
  schedule:
    - cron: '17 4 * * *'   # alleen het buildnummer (changelog.json) bijwerken
  workflow_dispatch:

concurrency:
  group: support-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Unittests (formulier Nieuw ticket)
        run: node --test tests/*.test.js

      - name: Changelog van bingr.online (buildnummer in de footer)
        id: cl
        run: |
          if curl -sSfL --max-time 20 https://bingr.online/assets/changelog.json -o /tmp/cl.json && python3 -c 'import json,sys;d=json.load(open("/tmp/cl.json"));assert isinstance(d,list) and d[0]["build"]'; then
            if cmp -s /tmp/cl.json site/assets/changelog.json; then echo "changed=0" >> $GITHUB_OUTPUT; else cp /tmp/cl.json site/assets/changelog.json; echo "changed=1" >> $GITHUB_OUTPUT; fi
            echo "::notice::Nieuwste build op bingr.online: $(python3 -c 'import json;print(json.load(open("site/assets/changelog.json"))[0]["build"])')"
          else
            echo "::warning::changelog.json van bingr.online niet opgehaald; de versie uit de repo blijft staan."; echo "changed=0" >> $GITHUB_OUTPUT
          fi

      - name: Controleren
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          missing=""
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do [ -n "${!k:-}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ontbreken:$missing — supportsite niet geüpload. Zie README.md."; echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          # 's nachts alleen als het buildnummer veranderd is
          if [ "${{ github.event_name }}" = schedule ] && [ "${{ steps.cl.outputs.changed }}" != 1 ]; then
            echo "::notice::Buildnummer ongewijzigd; niets te uploaden."; echo "skip=1" >> $GITHUB_OUTPUT; exit 0
          fi
          # nooit in de hoofdmap of de webmap van bingr.online uploaden: FTP_DIR moet de eigen map van het subdomein zijn
          # zonder FTP_DIR: upload naar de hoofdmap van de FTP-login (eigen FTP-account van het subdomein);
          # na het inloggen wordt gecontroleerd dat dat niet de webmap van bingr.online is
          d="${FTP_DIR%/}"; d="${d#/}"; d="${d#./}"
          [ -z "${FTP_DIR:-}" ] && d="(leeg)"
          case "$d" in
            "."|public_html|httpdocs|www|htdocs|domains/bingr.online/public_html)
              echo "::warning::FTP_DIR '$FTP_DIR' is de hoofdmap of de webmap van bingr.online, niet de map van support.bingr.online — niet geüpload."
              echo "skip=1" >> $GITHUB_OUTPUT ;;
          esac
          # controles: ticket- en Mijn-pagina's noindex, robots.txt blokkeert /ticket/, geen geheimen (alleen de publieke Supabase-URL en publishable key)
          grep -q 'name="robots" content="noindex' site/ticket/index.html || { echo "::error::site/ticket/index.html mist noindex"; exit 1; }
          grep -q 'Disallow: /ticket/' site/robots.txt || { echo "::error::robots.txt blokkeert /ticket/ niet"; exit 1; }
          if grep -rIlE 'service_role|sb_secret_|SUPPORT_ADMIN_SECRET=|BINGR_SMTP_PASSWORD=' site/; then echo "::error::site/ bevat iets wat op een geheim lijkt"; exit 1; fi

      - name: lftp installeren
        if: steps.check.outputs.skip != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uploaden via FTPS
        if: steps.check.outputs.skip != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          # spaties, tabs en regeleinden rond de secrets weghalen (komt vaak mee bij plakken)
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for k in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            v="${!k}"; t=$(trim "$v"); [ "$v" != "$t" ] && echo "::warning::$k had spaties of een regeleinde aan begin of eind; die zijn weggehaald."
            printf -v "$k" '%s' "$t"
          done
          FTP_USERNAME_ALT=$(trim "${FTP_USERNAME_ALT:-}")
          # alleen de hostnaam: zonder ftp://, pad of poort
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          # wachtwoord via LFTP_PASSWORD: tekens als , " \\ ; of # in het wachtwoord breken anders het lftp-commando
          export LFTP_PASSWORD="$FTP_PASSWORD"
          # alleen versleuteld (FTPS) met een geldig certificaat; geen terugval op gewone FTP of andere servers
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file /tmp/ftp-ca.pem"
          ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
          # certificaat geldig voor deze hostnaam? (controle vóór er inloggegevens worden verstuurd)
          # build 95: sommige FTP-servers sturen het tussencertificaat niet mee (onvolledige keten). Dat halen we op via
          # het AIA-adres in het certificaat zelf en zetten het naast de standaard root-certificaten; de controle tegen
          # een vertrouwde root blijft dus volledig.
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          add_chain(){
            local h="$1" aia
            aia=$(timeout 30 openssl s_client -connect "$h:21" -starttls ftp -servername "$h" </dev/null 2>/dev/null \
              | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
            [ -n "$aia" ] || return 0
            curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
            openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
            grep -q "$(sed -n 2p /tmp/inter.pem)" "$CA" || cat /tmp/inter.pem >> "$CA"
          }
          vcode(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -CAfile "$CA" </dev/null 2>/dev/null | grep -m1 'Verify return code' | sed 's/.*Verify return code: //' || true; }
          cert_ok(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" </dev/null 2>/dev/null | grep -q 'Verify return code: 0 (ok)'; }
          # Welke host? FTP_SERVER, anders ftp.bingr.online, anders bingr.online (zoals vroeger), maar alleen als het
          # certificaat klopt: voor die naam zelf, of voor een naam van de hoster (uit het certificaat; bij een wildcard
          # afgeleid) die naar hetzelfde IP-adres wijst. Pas daarna worden inloggegevens verstuurd.
          HOST=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && { echo "Certificaatcontrole opnieuw over 30 s…"; sleep 30; }
            for base in "$FTP_SERVER" ftp.bingr.online bingr.online; do
              base_ip=$(ip_of "$base"); [ -n "$base_ip" ] || continue
              [ "$attempt" = 1 ] && add_chain "$base"
              if cert_ok "$base"; then HOST="$base"; break 2; fi
              names=$(timeout 40 openssl s_client -connect "$base:21" -starttls ftp -servername "$base" </dev/null 2>/dev/null \
                | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              # build 95: ook de naam uit de reverse DNS van het IP-adres (bij gedeelde hosting de echte servernaam,
              # bv. web0123.zxcs.nl, die onder het wildcard-certificaat van de hoster valt)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              cands="$ptr"; first="${base%%.*}"
              for n in $names; do
                case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac
              done
              [ "$attempt" = 1 ] && echo "::notice::FTPS-certificaat op ${base}: $(echo $names | tr '\n' ' ') · servernaam: ${ptr:-onbekend}"
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                n_ip=$(ip_of "$n")
                if [ "$n_ip" != "$base_ip" ]; then [ "$attempt" = 1 ] && echo "::notice::${n}: ander IP-adres dan ${base}, overgeslagen"; continue; fi
                if cert_ok "$n"; then HOST="$n"; break 3; fi
                [ "$attempt" = 1 ] && echo "::notice::${n}: certificaatcontrole: $(vcode "$n")"
              done
            done
          done
          if [ -z "$HOST" ]; then
            echo "::error::Geen FTP-server met een geldig FTPS-certificaat gevonden (FTP_SERVER, ftp.bingr.online, bingr.online). Zet het secret FTP_SERVER op de hostnaam die op het certificaat van de hoster staat."
            exit 1
          fi
          [ "$HOST" != "$FTP_SERVER" ] && echo "::notice::Uploaden via ${HOST} (certificaat gecontroleerd)."
          USER_OK=""
          # de FTP-server reageert soms even niet: tot 4 pogingen met een pauze
          for attempt in 1 2 3 4; do
            [ "$attempt" -gt 1 ] && { echo "Nieuwe poging $attempt over 45 s…"; sleep 45; }
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              if lftp -e "$common; open --env-password -u \"$u\" \"$HOST\"; cls -1 > /tmp/root.txt; bye" 2>/tmp/err.txt; then
                USER_OK="$u"; break 2
              fi
              # foutmelding zonder regels die gebruikersnaam of wachtwoord kunnen bevatten
              msg=$(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200 || true)
              echo "::warning::Inloggen mislukt (poging $attempt): ${msg:-geen melding}"
            done
          done
          [ -n "$USER_OK" ] || { echo "::error::Inloggen op de FTP-server mislukt."; exit 1; }
          base="$common"; SERVER_OK="$HOST"
          echo "::notice::Ingelogd via FTPS (certificaat geverifieerd)"

          TARGET="${FTP_DIR%/}"
          if [ -z "$TARGET" ]; then
            TARGET="."
            # veiligheid: nooit in de webmap van bingr.online of de map van het beheer
            if grep -qxE '(koppelen|changelog|status|unsubscribe|account|web|reset)/?' /tmp/root.txt; then
              echo "::error::Zonder FTP_DIR komt deze FTP-login uit in de webmap van bingr.online. Gebruik een eigen FTP-account voor support.bingr.online of zet FTP_DIR."
              exit 1
            fi
            if grep -qxE '(admin\.js|admin\.css)' /tmp/root.txt; then
              echo "::error::Zonder FTP_DIR komt deze FTP-login uit in de map van beheer.bingr.online. Gebruik een eigen FTP-account voor support.bingr.online of zet FTP_DIR."
              exit 1
            fi
            echo "::notice::Geen FTP_DIR: upload naar de hoofdmap van de FTP-login"
          fi
          # begint de FTP-hoofdmap al in public_html (de webmap van bingr.online)? dan het voorvoegsel public_html/ weglaten,
          # anders ontstaat er een map public_html in de website
          t="${TARGET#/}"
          if [[ "$t" == public_html/* ]] && ! grep -qx 'public_html/\?' /tmp/root.txt; then
            TARGET="${t#public_html/}"
            echo "::notice::FTP-hoofdmap is al public_html; voorvoegsel public_html/ weggelaten"
          fi
          # map aanmaken als hij er nog niet is (mkdir -p -f: geen fout als hij al bestaat)
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mkdir -p -f \"$TARGET\"; bye" || true
          if [ "${{ github.event_name }}" = schedule ]; then
            lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mkdir -p -f \"$TARGET/assets\"; put site/assets/changelog.json -o \"$TARGET/assets/changelog.json\"; bye"
            echo "::notice::Alleen assets/changelog.json bijgewerkt"; exit 0
          fi
          lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store ./site/ \"$TARGET\"; bye"
          # oude bestanden opruimen: --delete alleen binnen de mappen die site/ zelf heeft (assets/, hulp/, …);
          # bestanden in de doelmap zelf (zoals .htaccess, .well-known/ of cgi-bin/ van de hoster) blijven altijd staan
          del=""
          for d in $(cd site && find . -mindepth 1 -maxdepth 1 -type d | sed 's#^\./##' | sort); do
            del="$del mirror -R --delete --only-newer --exclude-glob .DS_Store \"./site/$d/\" \"$TARGET/$d\";"
          done
          [ -n "$del" ] && lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; $del bye"
          echo "::notice::Supportsite geüpload"
          # rechten: map 755 en bestanden 644, anders geeft de webserver 403
          # (los van elkaar: de hoofdmap van een FTP-login mag vaak niet ge-chmod worden)
          [ "$TARGET" != "." ] && { lftp -e "$base; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; chmod 755 \"$TARGET\"; bye" >/dev/null 2>&1 || echo "::warning::chmod van de doelmap niet gelukt"; }
          dirs=$(cd site && find . -mindepth 1 -type d | sed 's#^\./##' | tr '\n' ' ')
          files=$(cd site && find . -type f | sed 's#^\./##' | tr '\n' ' ')
          lftp -e "set cmd:fail-exit false; $base; set cmd:fail-exit false; open --env-password -u \"$USER_OK\" \"$SERVER_OK\"; cd \"$TARGET\"; chmod 755 $dirs; chmod 644 $files; bye" >/dev/null 2>&1 \
            || echo "::warning::Niet alle rechten konden worden gezet"

      - name: Controleren of support.bingr.online de supportsite toont
        if: steps.check.outputs.skip != '1' && success() && github.event_name != 'schedule'
        run: |
          sleep 5
          url=https://support.bingr.online/
          code=$(curl -sL --max-time 20 -o /tmp/site.html -w '%{http_code}' "$url" || true)
          if grep -q 'name="bingr-app" content="support"' /tmp/site.html 2>/dev/null; then
            echo "::notice::$url toont de supportsite (HTTP $code)"
            for p in hulp/ hulp/samsung/ nieuw/ ticket/ mijn/ assets/css/support.css assets/js/support.js; do
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p"); [ "$c" = 200 ] && echo "::notice::/$p: 200" || echo "::warning::/$p gaf HTTP $c"
            done
            curl -sL --max-time 20 "${url}robots.txt" | grep -q 'Disallow: /ticket/' && echo "::notice::robots.txt blokkeert /ticket/" || echo "::warning::robots.txt op $url blokkeert /ticket/ niet"
            h=$(curl -sI --max-time 20 "${url}ticket/" | tr -d '\r' | grep -iE '^(x-robots-tag|content-security-policy|x-frame-options):' | cut -d: -f1 | tr '\n' ' ')
            echo "::notice::Headers op /ticket/: ${h:-geen (mod_headers uit?)}"
          else
            ip=$(getent hosts support.bingr.online | awk '{print $1}' | head -1)
            if [ -z "$ip" ]; then
              echo "::warning::support.bingr.online bestaat nog niet in DNS: maak het subdomein aan bij de hoster (zie README.md)."
            else
              for u in https://support.bingr.online/ https://support.bingr.online/index.html https://support.bingr.online/robots.txt http://support.bingr.online/; do
                r=$(curl -skI --max-time 15 "$u" | tr -d '\r' | grep -iE '^(HTTP|server|location)' | tr '\n' ' ')
                echo "::notice::$u -> ${r:-geen antwoord}"
              done
              cert=$(echo | openssl s_client -connect support.bingr.online:443 -servername support.bingr.online 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ')
              echo "::notice::Certificaat: ${cert:-geen}"
              echo "::warning::$url ($ip) geeft HTTP ${code:-geen antwoord}, nog niet de supportsite: wijst het subdomein naar FTP_DIR, en is er een SSL-certificaat? $(head -c 160 /tmp/site.html 2>/dev/null | tr '\n' ' ')"
            fi
          fi
